<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贺子轩的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #ffffff;
      color: #1a3a6b;
    }

    /* 顶部 */
    header {
      background: #1e6fd9;
      color: #ffffff;
      padding: 34px 20px;
      text-align: center;
    }
    header h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    /* 中间自我介绍 */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    .intro {
      max-width: 520px;
      background: #f2f7ff;
      border-left: 4px solid #1e6fd9;
      border-radius: 8px;
      padding: 24px 28px;
      font-size: 16px;
      line-height: 2;
    }

    /* 底部联系方式 */
    footer {
      background: #1e6fd9;
      color: #e8f2ff;
      text-align: center;
      padding: 20px;
      font-size: 14px;
      line-height: 1.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>贺子轩的个人主页</h1>
  </header>

  <main>
    <p class="intro">
      大家好，我是贺子轩，一名大一新生。我热爱设计与编程，喜欢把想法变成看得见的作品。希望在设计组里认识更多伙伴，一起学习、一起成长。
    </p>
  </main>

  <footer>
    联系方式：邮箱 hezixuan@example.com ｜ 电话 138-0000-0000 ｜ 微信 hezixuan
  </footer>

</body>
</html>
