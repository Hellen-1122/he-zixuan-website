<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 4 - ENDING</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f0f0f0; /* 网页外围浅灰背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }

        /* ================= 主画布 ================= */
        .canvas {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 85vh;
            max-height: 900px;
            background-color: #ffffff; /* 画布底色纯白 */
            overflow: hidden; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        /* ================= 核心大图 ================= */
        .hero-image {
            position: absolute;
            top: 10%;
            left: 8%;
            width: 85%;
            height: 80%;
            object-fit: cover;
            z-index: 1; /* 底层图片 */
        }

        /* ================= 左上角文字区域 ================= */
        .text-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 42%;
            height: 35%;
            background-color: rgba(217, 197, 137, 0.9); /* 半透明土黄色 */
            padding: 4vh 3vw;
            z-index: 4; /* 层级较高，盖在图片上方 */
            /* 使用 clip-path 切出右下角的斜边，贴合原图 */
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
        }

        .text-card p {
            /* 使用类似手写/斜体的字体 */
            font-family: 'Brush Script MT', 'Dancing Script', cursive, serif;
            font-style: italic;
            font-size: 1.6vw;
            line-height: 1.5;
            color: #111;
            letter-spacing: 0.5px;
        }

        /* ================= 装饰图形 ================= */
        /* 右上角半透明圆 */
        .circle-tr {
            position: absolute;
            top: 5%;
            right: 5%;
            width: 110px;
            height: 110px;
            background-color: #dcc28b; /* 卡其色 */
            border-radius: 50%;
            z-index: 3;
        }

        /* 左下角半透明圆 */
        .circle-bl {
            position: absolute;
            bottom: 6%;
            left: 5%;
            width: 90px;
            height: 90px;
            background-color: #ead3a5; /* 淡卡其色 */
            border-radius: 50%;
            z-index: 3;
        }

        /* 右下角不规则半透明色块 */
        .bottom-shape {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 75%;
            height: 40%;
            background-color: rgba(197, 159, 93, 0.9); /* 半透明深驼色 */
            z-index: 2; /* 在图片之上，但在大字之下 */
            /* 用 clip-path 切出一个多边形折角 */
            clip-path: polygon(25% 0, 100% 0, 100% 100%, 0 100%);
        }

        /* ================= 右下角大标题区域 ================= */
        .title-group {
            position: absolute;
            bottom: 2%;
            right: 2%;
            text-align: right;
            z-index: 5; /* 最高层级，显示在最上面 */
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .part-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 6.5vw;
            color: #000;
            letter-spacing: 2px;
            line-height: 1;
            position: relative;
            /* PART 4 文字有白色的描边效果 */
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff, 4px 4px 5px rgba(0,0,0,0.3);
            margin-bottom: 1vh;
        }

        /* PART 4 左侧的小圆点 */
        .part-title::before {
            content: '';
            position: absolute;
            left: -60px;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 45px;
            background-color: #8f6f39;
            border-radius: 50%;
            z-index: -1;
        }

        .main-title {
            font-family: 'Times New Roman', serif;
            font-weight: 900;
            font-size: 9vw;
            color: #000;
            letter-spacing: 0px;
            line-height: 0.8;
        }

        /* ================= 移动端简易适配 ================= */
        @media (max-width: 768px) {
            .canvas { height: 100vh; }
            .text-card { width: 80%; height: 35%; padding: 15px; clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); }
            .text-card p { font-size: 14px; }
            .hero-image { width: 95%; left: 2%; height: 65%; top: 20%; }
            .bottom-shape { width: 100%; height: 30%; }
            .part-title { font-size: 36px; }
            .part-title::before { width: 20px; height: 20px; left: -25px; }
            .main-title { font-size: 60px; }
            .circle-tr, .circle-bl { width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

    <div class="canvas">
        
        <!-- 1. 核心大图 (城市天际线与桥梁) -->
        <img class="hero-image" src="https://images.unsplash.com/photo-1506012787146-f92b2d7d6d96?q=80&w=2000&auto=format&fit=crop" alt="Cityscape Bridge">

        <!-- 2. 左上角文字 -->
        <div class="text-card">
            <p>Why tell this story? Because as future engineers, we will build tomorrow's technology. We must race forward, but always serve humanity with warmth.</p>
        </div>

        <!-- 3. 装饰图形 -->
        <div class="circle-tr"></div>
        <div class="circle-bl"></div>
        
        <!-- 4. 右下角不规则背景色块 -->
        <div class="bottom-shape"></div>

        <!-- 5. 右下角文字 -->
        <div class="title-group">
            <div class="part-title">PART 4</div>
            <div class="main-title">ENDING</div>
        </div>

    </div>

</body>
</html>
