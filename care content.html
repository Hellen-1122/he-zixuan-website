<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Part 2 - CARE</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e5e5e5; /* 网页外围浅灰背景 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', serif;
        }

        /* ================= 主画布 ================= */
        .canvas {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 85vh;
            max-height: 900px;
            background-color: #ffffff; /* 画布底色为纯白 */
            overflow: hidden; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        /* ================= 核心大图 ================= */
        .hero-image {
            position: absolute;
            top: 8%;
            left: 5%;
            width: 90%;
            height: 80%;
            object-fit: cover;
            z-index: 1; /* 底层图片 */
        }

        /* ================= 左上角文字区域 ================= */
        .text-card {
            position: absolute;
            top: 0;
            left: 0;
            width: 45%;
            height: 35%;
            background-color: #eadeab; /* 淡黄色背景 */
            padding: 3vh 3vw;
            z-index: 4; /* 层级较高，盖在图片上方 */
        }

        .text-card p {
            /* 使用类似手写/斜体的字体 */
            font-family: 'Brush Script MT', 'Dancing Script', cursive, serif;
            font-style: italic;
            font-size: 1.4vw;
            line-height: 1.5;
            color: #111;
            letter-spacing: 0.5px;
        }

        /* ================= 装饰几何图形 ================= */
        /* 右上角半透明圆 */
        .circle-tr {
            position: absolute;
            top: 4%;
            right: 2%;
            width: 120px;
            height: 120px;
            background-color: rgba(218, 189, 123, 0.8);
            border-radius: 50%;
            z-index: 3;
        }

        /* 左下角半透明圆 */
        .circle-bl {
            position: absolute;
            bottom: 3%;
            left: 2%;
            width: 90px;
            height: 90px;
            background-color: rgba(218, 189, 123, 0.8);
            border-radius: 50%;
            z-index: 3;
        }

        /* 右下角不规则半透明色块 */
        .bottom-shape {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 75%;
            height: 35%;
            background-color: rgba(203, 171, 115, 0.85); /* 半透明土黄色 */
            z-index: 2; /* 在图片之上，但在大字之下 */
            /* 用 clip-path 切出斜角 */
            clip-path: polygon(15% 20%, 100% 0, 100% 100%, 0 100%);
        }

        /* ================= 右下角大标题区域 ================= */
        .title-group {
            position: absolute;
            bottom: 2%;
            right: 3%;
            text-align: right;
            z-index: 5; /* 最高层级，显示在最上面 */
        }

        .part-title {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 6vw;
            color: #000;
            letter-spacing: 5px;
            line-height: 1;
            position: relative;
            display: inline-block;
            margin-bottom: 2vh;
        }

        /* PART 2 左侧的小圆点 */
        .part-title::before {
            content: '';
            position: absolute;
            left: -50px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background-color: #d1b77b;
            border-radius: 50%;
            z-index: -1;
        }

        .main-title {
            font-family: 'Times New Roman', serif;
            font-weight: 900;
            font-size: 12vw;
            color: #000;
            letter-spacing: -2px;
            line-height: 0.8;
            /* 阴影增加立体感 */
            text-shadow: 3px 3px 0px rgba(255,255,255,0.5);
        }

        /* ================= 移动端简易适配 ================= */
        @media (max-width: 768px) {
            .canvas { height: 100vh; }
            .text-card { width: 80%; height: 30%; padding: 15px; }
            .text-card p { font-size: 12px; }
            .hero-image { width: 100%; left: 0; height: 60%; }
            .bottom-shape { width: 100%; height: 30%; }
            .part-title { font-size: 40px; }
            .part-title::before { width: 20px; height: 20px; left: -25px; }
            .main-title { font-size: 80px; }
            .circle-tr, .circle-bl { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>

    <div class="canvas">
        
        <!-- 1. 核心大图 (农田拖拉机) -->
        <img class="hero-image" src="https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=2000&auto=format&fit=crop" alt="Agriculture Tractor">

        <!-- 2. 左上角文字 -->
        <div class="text-card">
            <p>Yet, China's technological advancement is not merely about building modern cities; it is about serving the people. Beyond the speed of urbanization, technology finds its true value in bringing warmth to everyday life.</p>
        </div>

        <!-- 3. 装饰图形 -->
        <div class="circle-tr"></div>
        <div class="circle-bl"></div>
        
        <!-- 4. 右下角半透明切角背景 -->
        <div class="bottom-shape"></div>

        <!-- 5. 右下角文字 -->
        <div class="title-group">
            <div class="part-title">PART 2</div>
            <div class="main-title">CARE</div>
        </div>

    </div>

</body>
</html>
